<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Pièce Introuvable (404) — JACMAT STORE</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#09090b">

  <link rel="icon" href="/favicon.ico" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/main.css">
</head>
<body data-page="404" style="display: flex; flex-direction: column; min-height: 100vh; background: var(--color-obsidian); color: var(--color-white);">

  <header style="padding: 24px var(--gutter); border-bottom: 1px solid rgba(255, 255, 255, 0.1); text-align: center;">
    <a href="/" aria-label="JACMAT STORE">
      <img src="/logo white.png" alt="Jacmat Store" width="130" height="50" style="margin: 0 auto;">
    </a>
  </header>

  <main style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 48px var(--gutter);">
    <div style="max-width: 540px; width: 100%; text-align: center;">
      <span class="editorial-kicker" style="color: #a1a1aa;">Erreur 404</span>
      <h1 style="font-family: var(--font-display); font-size: clamp(2.8rem, 6vw, 4.5rem); font-weight: 800; line-height: 1; margin: 16px 0 24px;">
        Pièce <em class="serif-italic" style="color: #ffffff;">introuvable.</em>
      </h1>
      <p style="color: #a1a1aa; font-size: var(--text-lg); line-height: 1.6; margin-bottom: 32px;">
        La page ou le drop que vous recherchez n'existe pas ou a été déplacé vers une autre collection.
      </p>
      <div style="display: flex; flex-wrap: wrap; gap: 14px; justify-content: center;">
        <a href="/" class="btn" style="background: transparent; border: 1px solid rgba(255, 255, 255, 0.3); color: #ffffff;">Retour à l'accueil</a>
        <a href="/shop" class="btn btn-secondary">Explorer la boutique</a>
      </div>
    </div>
  </main>

  <footer style="padding: 24px var(--gutter); border-top: 1px solid rgba(255, 255, 255, 0.08); text-align: center; font-size: var(--text-xs); color: var(--color-muted-dark);">
    <p>&copy; 2026 JACMAT STORE — BE YOU & WEAR US</p>
  </footer>

</body>
</html>
